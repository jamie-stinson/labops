name: Sync CRDs

on:
  pull_request:
    paths:
      - "helm/charts/**/values.yaml"

jobs:
  sync-crds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Fetch CRDs
        run: |
          set -euo pipefail

          for chart in helm/charts/*; do
            values="$chart/values.yaml"
            [ -f "$values" ] || continue

            tag=$(yq '.workload.image.tag' "$values")
            chart_name=$(basename "$chart")

            echo "Fetching CRDs for $chart_name ($tag)"
            mkdir -p "$chart/crds"

            case "$chart_name" in
              cert-manager-controller)
                url="https://github.com/cert-manager/cert-manager/releases/download/${tag}/cert-manager.crds.yaml"
                curl -sSL "$url" -o "$chart/crds/${chart_name}.crds.yaml"
                ;;
              cloudnative-pg)
                url="https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v${tag}/cnpg-${tag}.yaml"
                tmpfile="$(mktemp)"
                curl -sSL "$url" -o "$tmpfile"
                yq eval 'select(.kind == "CustomResourceDefinition")' "$tmpfile" > "$chart/crds/${chart_name}.crds.yaml"
                rm "$tmpfile"
                ;;
              *)
                echo "No CRD fetch rule for $chart_name, skipping"
                ;;
            esac
          done

      - name: Commit CRDs to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/charts/*/crds || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync CRDs for updated tags"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No CRD changes detected"
          fi
