name: Sync CRDs

on:
  pull_request:
    paths:
      - "helm/charts/**/values.yaml"

jobs:
  sync-crds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Fetch and Validate CRDs
        run: |
          set -euo pipefail

          # Ensure temporary files are cleaned up on exit
          tmpfiles=()
          cleanup() {
            for f in "${tmpfiles[@]}"; do
              [ -f "$f" ] && rm -f "$f"
            done
          }
          trap cleanup EXIT

          for chart in helm/charts/*; do
            values="$chart/values.yaml"
            [ -f "$values" ] || continue

            tag=$(yq '.workload.image.tag' "$values")
            chart_name=$(basename "$chart")
            mkdir -p "$chart/crds"

            case "$chart_name" in
              cert-manager-controller)
                url="https://github.com/cert-manager/cert-manager/releases/download/${tag}/cert-manager.crds.yaml"
                crd_file="$chart/crds/crds.yaml"
                ;;
              cloudnative-pg)
                tmpfile=$(mktemp)
                tmpfiles+=("$tmpfile")
                url="https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v${tag}/cnpg-${tag}.yaml"
                crd_file="$chart/crds/cloudnative-pg.crds.yaml"
                ;;
              argo-rollouts-controller)
                tmpfile=$(mktemp)
                tmpfiles+=("$tmpfile")
                url="https://github.com/argoproj/argo-rollouts/releases/download/v${tag}/install.yaml"
                crd_file="$chart/crds/argo-rollouts-controller.crds.yaml"
                ;;
              *)
                echo "No CRD fetch rule for $chart_name, skipping"
                continue
                ;;
            esac

            echo "Fetching $chart_name CRDs from $url"
            
            # Download file
            if [[ "${chart_name}" == "cert-manager-controller" ]]; then
              curl -sSL "$url" -o "$crd_file"
            else
              curl -sSL "$url" -o "$tmpfile"
              echo "Downloaded ${tmpfile} size: $(stat -c%s "$tmpfile") bytes"
              yq eval-all 'select(.kind == "CustomResourceDefinition")' "$tmpfile" > "$crd_file"
            fi

            # Debug: show number of CRDs found
            crd_count=$(yq eval '... | select(.kind == "CustomResourceDefinition") | length' "$crd_file" 2>/dev/null || echo 0)
            echo "CRDs extracted: $crd_count"

            # Validate CRDs exist and are non-empty
            if [ ! -f "$crd_file" ] || [ ! -s "$crd_file" ]; then
              echo "ERROR: $crd_file does not exist or is empty!"
              echo "Downloaded file preview:"
              head -n 20 "${tmpfile:-$crd_file}" || true
              exit 1
            fi

            # Ensure all documents are CRDs
            if [ -n "$(yq eval-all 'select(.kind != "CustomResourceDefinition")' "$crd_file")" ]; then
              echo "ERROR: $crd_file contains non-CRD resources!"
              exit 1
            fi

            echo "$crd_file looks good"
          done



      - name: Commit CRDs to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage new/changed CRDs
          git add helm/charts/*/crds || true

          # Commit only if something is staged
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync CRDs for updated tags"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No CRD changes detected"
          fi
