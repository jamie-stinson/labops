namespace: "argocd"
autoPatching:
  enabled: true
  annotations:
    argocd-image-updater.argoproj.io/image-list: "argocd-repo-server=quay.io/argoproj/argocd:~v3"
workload:
  image:
    repository: "quay.io/argoproj/argocd"
    tag: "v3.1.0"
  command:
  - 'argocd-repo-server'
  args:
  - '--port=8081'
  - '--metrics-port=8084'
  - '--logformat=text'
  - '--loglevel=info'
  envs:
  - name: ARGOCD_REPO_SERVER_NAME
    value: argocd-repo-server
  - name: ARGOCD_EXEC_TIMEOUT
    value: "180"
  - name: ARGOCD_GIT_ATTEMPTS_COUNT
    value: "3"
  - name: ARGOCD_HELM_ALLOW_CONCURRENCY
    value: "true"
  resources:
    preset: ""
    custom:
      requests:
        cpu: "50m"
        memory: "512Mi"
        ephemeral-storage: "1Gi"
      limits:
        memory: "512Mi"
        ephemeral-storage: "1Gi"
  probes:
    readinessProbe:
      path: "/healthz"
      port: 8084
    livenessProbe:
      path: "/healthz?full=true"
      port: 8084
  storage:
  - name: tmp
    type: emptyDir
    mountPath: /tmp
    ramDisk: false
    readOnly: false
  - name: gpg-keys
    type: emptyDir
    mountPath: /app/config/gpg/keys
    ramDisk: false
    readOnly: false
  - name: var-files
    type: emptyDir
    mountPath: /var/run/argocd
  - name: plugins
    type: emptyDir
    mountPath: /home/argocd/plugins
  - name: cmp-grafana-plugin-volume
    type: configMap
    configMapName: cmp-grafana-plugin
  envsConfigMap:
  - name: ARGOCD_REPOSERVER_LOGFORMAT
    configMap: argocd-cmd-params-cm
    key: reposerver.log.format
  - name: ARGOCD_REPOSERVER_LOG_LEVEL
    configMap: argocd-cmd-params-cm
    key: reposerver.log.level
  - name: ARGOCD_REPOSERVER_PARALLELISM_LIMIT
    configMap: argocd-cmd-params-cm
    key: reposerver.parallelism.limit
  - name: REDIS_SERVER
    configMap: argocd-cmd-params-cm
    key: redis.server
  - name: ARGOCD_SERVER_OTLP_ADDRESS
    configMap: argocd-cmd-params-cm
    key: otlp.address
  extraContainers:
    - name: grafana-dashboard-generator
      image: quay.io/argoproj/argocd:v3.1.0
      command: [/var/run/argocd/argocd-cmp-server]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/plugins          
        - name: cmp-grafana-plugin-volume
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: plugin.yaml
        - name: tmp
          mountPath: /tmp
service:
  ports:
  - name: http
    port: 8081
    protocol: TCP
  - name: http-metrics
    port: 8084
    protocol: TCP
