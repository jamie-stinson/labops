# cmp-grafana-plugin-cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-grafana-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: grafana-dashboard-generator
    spec:
      discover:
        find:
          command: [sh, -c, 'find .. -maxdepth 1 -type d -name dashboards -print -quit']
      generate:
        command: [sh, -c]
        args:
          - |
            #!/bin/sh
            set -e

            echo "--- Grafana Plugin: Starting script in $(pwd) ---" >&2

            DASHBOARD_DIR="../dashboards"

            if [ ! -d "$DASHBOARD_DIR" ]; then
              echo "--- Grafana Plugin: '$DASHBOARD_DIR' directory NOT FOUND. Exiting. ---" >&2
              exit 0
            fi

            echo "--- Grafana Plugin: Found '$DASHBOARD_DIR'. Searching for JSON files... ---" >&2
            find "$DASHBOARD_DIR" -type f -name "*.json" -exec echo "--- Grafana Plugin: Found file: {} ---" \; >&2

            find "$DASHBOARD_DIR" -type f -name "*.json" | while read -r file; do
              echo "--- Grafana Plugin: Processing file: ${file} ---" >&2

              dashboard_name=$(basename "$file" .json | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
              json_content=$(sed 's/^/    /' "$file")

              cat <<EOF
            ---
            apiVersion: grafana.integreatly.org/v1beta1
            kind: GrafanaDashboard
            metadata:
              name: "${dashboard_name}"
              namespace: "${ARGOCD_APP_NAMESPACE}"
            spec:
              instanceSelector:
                matchLabels:
                  dashboards: "grafana"
              json: |
            ${json_content}
            EOF
            done
            echo "--- Grafana Plugin: Script finished. ---" >&2
