    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: "production"
      namespace: argocd
    spec:
      sourceNamespaces:
        - "*"
      sourceRepos:
        - "*"
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      destinations:
        - server: https://kubernetes.default.svc
          namespace: "*"

