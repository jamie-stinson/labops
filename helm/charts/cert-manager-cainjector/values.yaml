workload:
  image:
    repository: "quay.io/jetstack/cert-manager-cainjector"
    tag: "v1.18.2"
  args:
  - '--v=2'
  - '--leader-elect'
  - '--leader-election-lease-duration=15s'
  - '--leader-election-renew-deadline=10s'
  - '--leader-election-retry-period=2s'
  - '--leader-election-namespace=$(POD_NAMESPACE)'
  - '--logging-format=json'
  - '--metrics-listen-address=0.0.0.0:$(CERT_MANAGER_CAINJECTOR_SERVICE_PORT_HTTP_METRICS)'
  probes:
    readinessProbe:
      path: "/metrics"
      port: http-metrics
    livenessProbe:
      path: "/metrics"
      port: http-metrics
  resources:
    preset: ""
    custom:
      requests:
        cpu: "10m"
        memory: "192Mi"
      limits:
        memory: "192Mi"
  priorityClassName: "application-critical"
  #tmp
  securityContext:
    readOnlyRootFilesystem: true

service:
  ports:
  - name: http-metrics
    protocol: TCP
    port: 9100

rbac:
  enabled: true
  roles:
    clusterRole:
      rules:
      # Needed by cainjector to watch Certificate resources and update CA bundles.
      - apiGroups: ["cert-manager.io"]
        resources: ["certificates"]
        verbs: ["get", "list", "watch"]
      # Required to read TLS secrets for injecting CA data into resources.
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list", "watch"]
      # Allows cainjector to record and update Kubernetes Events for observability.
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["get", "create", "update", "patch"]
      # Required to inject CA bundles into admission webhook configurations.
      - apiGroups: ["admissionregistration.k8s.io"]
        resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
        verbs: ["get", "list", "watch", "update", "patch"]
      # Needed to inject CA bundles into aggregated API services.
      - apiGroups: ["apiregistration.k8s.io"]
        resources: ["apiservices"]
        verbs: ["get", "list", "watch", "update", "patch"]
      # Required to inject CA bundles into CRDs that serve webhooks.
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["get", "list", "watch", "update", "patch"]
    role:
      rules:
      # Allows leader election controllers to coordinate via named Leases.
      - apiGroups: ["coordination.k8s.io"]
        resources: ["leases"]
        resourceNames: ["cert-manager-cainjector-leader-election", "cert-manager-cainjector-leader-election-core"]
        verbs: ["get", "update", "patch"]
      # Required so the leader election mechanism can create its Lease objects.
      - apiGroups: ["coordination.k8s.io"]
        resources: ["leases"]
        verbs: ["create"]
