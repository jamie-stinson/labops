global:
  leaderElection:
    namespace: "cert-manager"
  logLevel: 6
crds:
  enabled: true
  keep: false
extraArgs:
  - --enable-certificate-owner-ref=true
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
podDisruptionBudget:
  enabled: true
  minAvailable: 1
resources:
  requests:
    cpu: "10m"
    memory: "128Mi"
    ephemeral-storage: "16Mi"
  limits:
    memory: "128Mi"
    ephemeral-storage: "16Mi"
webhook:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: "10m"
      memory: "128Mi"
      ephemeral-storage: "16Mi"
    limits:
      memory: "128Mi"
      ephemeral-storage: "16Mi"
cainjector:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: "10m"
      memory: "128Mi"
      ephemeral-storage: "16Mi"
    limits:
      memory: "128Mi"
      ephemeral-storage: "16Mi"
