service:
  type: "NodePort"

ingressClass:
  enabled: true
  isDefault: false
  controller: "istio.io/ingress-controller"

certificate:
  enabled: true
  spec:
    secretName: "letsencrypt-wildcard-certificate"
    dnsNames:
    - 'projectwhitebox.com'
    - '*.projectwhitebox.com'
    issuerRef:
      name: "istio-ingress-gateway"
      kind: Issuer
issuer:
  enabled: true
  type: Issuer
  spec:
    acme:
      email: "jamiestinson1@icloud.com"
      solvers:
      - dns01:
          cloudflare:
            email: "jamiestinson1@icloud.com"
            apiTokenSecretRef:
              name: cloudflare
              key: API_TOKEN
      server: https://acme-v02.api.letsencrypt.org/directory
      privateKeySecretRef:
        name: letsencrypt-acme-key

extraObjects:
  - |
    apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: cloudflare
      namespace: istio-ingress-gateway
    spec:
      encryptedData:
        API_TOKEN: 
      template:
        metadata:
          name: cloudflare
          namespace: istio-ingress-gateway
        type: Opaque
