service:
  enabled: false
  type: "NodePort"

certificate:
  enabled: true
  spec:
    secretName: "letsencrypt-wildcard-certificate"
    dnsNames:
    - 'projectwhitebox.com'
    - '*.projectwhitebox.com'
    issuerRef:
      name: "istio-ingress-gateway"
      kind: Issuer
issuer:
  enabled: true
  type: Issuer
  spec:
    acme:
      email: "jamiestinson1@icloud.com"
      solvers:
      - dns01:
          cloudflare:
            email: "jamiestinson1@icloud.com"
            apiTokenSecretRef:
              name: cloudflare
              key: API_TOKEN
      server: https://acme-v02.api.letsencrypt.org/directory
      privateKeySecretRef:
        name: letsencrypt-acme-key

extraObjects:
  - |
    apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: cloudflare
      namespace: istio
    spec:
      encryptedData:
        API_TOKEN: 
      template:
        metadata:
          name: cloudflare
          namespace: istio
        type: Opaque
  - |
    apiVersion: networking.istio.io/v1beta1
    kind: Gateway
    metadata:
      name: external
      namespace: istio
    spec:
      selector:
        istio: ingress-gateway
      servers:
      - port:
          number: 443
          name: https
          protocol: HTTPS
        tls:
          mode: SIMPLE
          credentialName: letsencrypt-wildcard-certificate
        hosts:
        - "*.projectwhitebox.com"

workload:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false

serviceAccount:
  enabled: false
