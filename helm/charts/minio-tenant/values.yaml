namespace: "minio"

workload:
  enabled: false

service:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false

serviceAccount:
  enabled: false

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "internalweb, internalwebsecure"
  hosts:
    - host: minio.projectwhitebox.com
      path: /
      pathType: "Prefix"
      tls:
        enabled: false
      backend:
        service:
          name: "minio-console"
          port: 9090

extraObjects:
  - |
    apiVersion: minio.min.io/v2
    kind: Tenant
    metadata:
      labels:
        app: minio
      name: minio
      namespace: minio
    spec:
      buckets:
        - name: thanos
      configuration:
        name: minio
      features:
        bucketDNS: true
        enableSFTP: false
      image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
      imagePullPolicy: IfNotPresent
      mountPath: /export
      podManagementPolicy: Parallel
      pools:
        - name: pool
          resources:
            requests:
              cpu: "50m"
              memory: "1Gi"
            limits:
              memory: "1Gi"
          servers: 1
          volumesPerServer: 1
          volumeClaimTemplate:
            metadata:
              name: data
            spec:
              storageClassName: minio-operator
              accessModes:
                - ReadWriteOnce
              volumeMode: Filesystem
              resources:
                requests:
                  storage: 465Gi
      poolsMetadata:
        annotations: {}
        labels: {}
      prometheusOperator: false
      requestAutoCert: false
      subPath: /data
  - |
    apiVersion: sts.min.io/v1alpha1
    kind: PolicyBinding
    metadata:
      name: thanos
      namespace: minio
    spec:
      application:
        namespace: thanos
        serviceaccount: thanos
      policies:
        - readwrite
