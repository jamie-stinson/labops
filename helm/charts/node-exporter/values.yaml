workload:
  enabled: false
service:
  ports:
  - name: http-metrics
    protocol: TCP
    port: 9100

extraObjects:
  - |
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      labels:
        app.kubernetes.io/instance: node-exporter
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/part-of: node-exporter
        app.kubernetes.io/version: 1.9.1
      name: node-exporter
      namespace: node-exporter
    spec:
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app.kubernetes.io/instance: node-exporter
          app.kubernetes.io/name: node-exporter
      template:
        metadata:
          annotations:
            cluster-autoscaler.kubernetes.io/safe-to-evict: 'true'
          labels:
            app.kubernetes.io/instance: node-exporter
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: node-exporter
            app.kubernetes.io/part-of: node-exporter
            app.kubernetes.io/version: 1.9.1
        spec:
          containers:
            - args:
                - '--path.procfs=/host/proc'
                - '--path.sysfs=/host/sys'
                - '--path.rootfs=/host/root'
                - '--path.udev.data=/host/root/run/udev/data'
                - '--web.listen-address=[$(HOST_IP)]:9100'
                - '--log.format=json'
              env:
                - name: HOST_IP
                  value: 0.0.0.0
              image: quay.io/prometheus/node-exporter:v1.9.1
              imagePullPolicy: IfNotPresent
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: http-metrics
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
              name: node-exporter
              ports:
                - containerPort: 9100
                  name: http-metrics
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: http-metrics
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
              resources:
                limits:
                  ephemeral-storage: 128Mi
                  memory: 128Mi
                requests:
                  cpu: 10m
                  ephemeral-storage: 128Mi
                  memory: 128Mi
              securityContext:
                readOnlyRootFilesystem: true
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /host/proc
                  name: proc
                  readOnly: true
                - mountPath: /host/sys
                  name: sys
                  readOnly: true
                - mountPath: /host/root
                  mountPropagation: HostToContainer
                  name: root
                  readOnly: true
          dnsPolicy: ClusterFirst
          hostNetwork: true
          hostPID: true
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          serviceAccount: node-exporter
          serviceAccountName: node-exporter
          terminationGracePeriodSeconds: 30
          tolerations:
            - effect: NoSchedule
              operator: Exists
          volumes:
            - hostPath:
                path: /proc
                type: ''
              name: proc
            - hostPath:
                path: /sys
                type: ''
              name: sys
            - hostPath:
                path: /
                type: ''
              name: root
      updateStrategy:
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
        type: RollingUpdate
