workload:
  type: "StatefulSet"
  image:
    registry: "docker.io"
    repository: slskd/slskd
    tag: latest
  strategy:
    type: OnDelete
  resources:
    preset: ""
    custom:
      requests:
        cpu: "100m"
        memory: "1Gi"
        ephemeral-storage: "2Gi"
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    fsGroup: 0
    fsGroupChangePolicy: "OnRootMismatch"
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: false
  probes:
    readinessProbe:
      type: tcpSocket
      port: 5030
    livenessProbe:
      type: tcpSocket
      port: 5030
  storage:
    - name: slskd-config
      type: pvc
      mountPath: /app
      claimName: "slskd-config"
    - name: slskd-music
      type: pvc
      mountPath: /music
      claimName: "slskd-music"

service:
  ports:
    - name: http
      port: 5030
      protocol: TCP

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "internalweb, internalwebsecure"
  hosts:
    - host: slskd.projectwhitebox.com
      path: /
      pathType: "Prefix"
      tls:
        enabled: false
      backend:
        service:
          name: "slskd"
          port: 5030

autoscaling:
  enabled: false

extraObjects:
  - |
    apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: slskd-music
    spec:
      capacity:
        storage: 1Ti
      accessModes:
        - ReadWriteMany
      nfs:
        server: 10.0.0.10
        path: "/mnt/hdd-pool/music"
      mountOptions:
        - nfsvers=4.1 
        - hard
        - noatime
        - rsize=1048576 
        - wsize=1048576 
        - proto=tcp
        - async
        - nconnect=8
  - |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: slskd-music
      namespace: slskd
    spec:
      accessModes:
        - ReadWriteMany
      storageClassName: ""
      resources:
        requests:
          storage: 1Ti
      volumeName: slskd-music
  - |
    apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: slskd-config
    spec:
      capacity:
        storage: 1Ti
      accessModes:
        - ReadWriteMany
      nfs:
        server: 10.0.0.10
        path: "/mnt/data-pool/slskd"
      mountOptions:
        - nfsvers=4.1 
        - hard
        - noatime
        - rsize=1048576 
        - wsize=1048576 
        - proto=tcp
        - async
        - nconnect=8
  - |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: slskd-config
      namespace: slskd
    spec:
      accessModes:
        - ReadWriteMany
      storageClassName: ""
      resources:
        requests:
          storage: 1Ti
      volumeName: slskd-config
